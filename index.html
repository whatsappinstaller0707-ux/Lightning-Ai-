<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lightning AI | OS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="dark-mode">

<div class="app">
    <div id="historyPanel" class="side-panel">
        <div class="panel-header">
            <h3>Recent Chats</h3>
            <button onclick="uiAction('close')" style="background:none; border:none; color:white; font-size:20px;">✕</button>
        </div>
        <div id="historyList">No recent conversations</div>
    </div>

    <div id="settingsSheet" class="bottom-sheet">
        <div style="width:40px; height:4px; background:var(--glass-border); margin: 0 auto 20px; border-radius:2px;" onclick="uiAction('close')"></div>
        <div class="option-item" onclick="toggleTheme()">
            <div>
                <p>Appearance</p>
                <span style="font-size:12px; opacity:0.6;">Toggle Light/Dark Mode</span>
            </div>
            <i data-lucide="moon"></i>
        </div>
    </div>

    <div class="home-screen">
        <div id="brandPill" class="brand-pill-center">⚡ LIGHTNING <span>AI</span></div>
        <div id="suggestions" class="suggestions-container">
            <div class="suggest-card" onclick="startChat('Explain Quantum Computing')">Explain Quantum Computing</div>
            <div class="suggest-card" onclick="startChat('Write a Python Script')">Write a Python Script</div>
        </div>
        <div id="chatBox" class="chat-viewport"></div>
    </div>

    <div class="nav-wrapper">
        <nav class="glass-bar">
            <div id="inputZone" class="input-container hidden">
                <input type="text" id="userPrompt" placeholder="Ask anything..." autocomplete="off">
                <button id="sendBtn"><i data-lucide="arrow-up"></i></button>
            </div>
            <div id="navItems" class="nav-items-group">
                <div class="nav-btn" onclick="uiAction('main')"><i data-lucide="message-circle"></i><span>Chat</span></div>
                <div class="nav-btn" onclick="uiAction('temp')"><i data-lucide="timer"></i><span>Temp</span></div>
                <div class="nav-btn" onclick="uiAction('all')"><i data-lucide="layers"></i><span>All</span></div>
                <div class="nav-btn" onclick="uiAction('settings')"><i data-lucide="settings"></i><span>Settings</span></div>
            </div>
            <div id="menuToggle" class="hidden" onclick="deactivateMainChat()" style="cursor:pointer;">
                <i data-lucide="more-horizontal"></i>
            </div>
        </nav>
    </div>
</div>

<script src="script.js"></script>
</body>

            <div id="navItems" class="nav-items-group">

                <div class="nav-btn" onclick="uiAction('main')">
                    <i data-lucide="message-circle"></i>
                    <span>Main Chat</span>
                </div>

                <div class="nav-btn" onclick="uiAction('temp')">
                    <i data-lucide="timer"></i>
                    <span>Temp</span>
                </div>

                <div class="nav-btn" onclick="uiAction('all')">
                    <i data-lucide="layers"></i>
                    <span>All</span>
                </div>

                <div class="nav-btn" onclick="uiAction('settings')">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </div>

            </div>

            <!-- MENU -->
            <div

        </nav>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
